[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-self-improvement"
version = "0.1.0"
description = "Hermes user plugin for observing runtime events and generating guarded self-improvement proposals."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "dspy>=3.1,<4",
]

[dependency-groups]
dev = [
  "pytest>=9,<10",
]

[tool.setuptools]
packages = ["hermes_self_improvement"]
