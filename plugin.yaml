name: hermes-self-improvement
version: 0.1.0
description: Observes Hermes runtime events and provides offline self-improvement analysis, proposal, scoring, and reports for skills and memory.
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - pre_llm_call
  - post_llm_call
  - pre_api_request
  - post_api_request
  - on_session_start
  - on_session_end
  - on_session_finalize
  - on_session_reset
  - subagent_stop
provides_tools:
  - self_improvement_status
  - self_improvement_report
  - self_improvement_improve
  - self_improvement_calibrate
  - self_improvement_plan
  - self_improvement_apply
  - self_improvement_rollback
  - self_improvement_record_outcome
