name: hermes-self-improvement
version: 0.1.0
description: Observes Hermes runtime events and provides offline self-improvement analysis, proposal, scoring, and reports for skills and memory.
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - pre_llm_call
  - post_llm_call
  - pre_api_request
  - post_api_request
  - on_session_start
  - on_session_end
  - on_session_finalize
  - on_session_reset
  - subagent_stop
provides_tools:
  - self_improvement_status
  - self_improvement_generate_apply_plan
  - self_improvement_ledger_report
  - self_improvement_approval_report
  - self_improvement_validate_approval
  - self_improvement_retention_report
  - self_improvement_retention_prune
  - self_improvement_approve
  - self_improvement_apply_approved
  - self_improvement_apply_low_risk
  - self_improvement_rollback_low_risk
