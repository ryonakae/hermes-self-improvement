# Example operator config for hermes-self-improvement.
# Copy to config.yaml or config.local.yaml for local overrides.
# Defaults live in hermes_self_improvement/config.py; keep this file to only
# the overrides an operator is likely to customize.
# Do not commit real API keys or provider secrets. For custom endpoints, prefer
# ${ENV_VAR} references in the local file.

# Optional: disable or bound mutating runs without changing CLI usage.
# mutation:
#   enabled: false
#   max_tool_calls: 12

# Optional: customize models only when auto routing is not enough.
# planner reads evidence and produces transaction plans, editor executes skill
# and memory mutations through official tools, evaluator scores results, and
# calibrator runs prompt-overlay optimization for planner/editor/evaluator.
# model:
#   planner:
#     provider: openrouter
#     model: anthropic/claude-sonnet-4
#     api_key: ${OPENROUTER_API_KEY}
#   editor:
#     provider: openrouter
#     model: anthropic/claude-sonnet-4
#     api_key: ${OPENROUTER_API_KEY}
#   evaluator:
#     provider: openrouter
#     model: anthropic/claude-sonnet-4
#     api_key: ${OPENROUTER_API_KEY}
#   calibrator:
#     provider: openrouter
#     model: anthropic/claude-sonnet-4
#     api_key: ${OPENROUTER_API_KEY}

# Optional: tune calibration evidence thresholds when supervised runs show that
# the default evidence gate is too strict or too loose.
# calibration:
#   evidence:
#     window_days: 30
#     min_evidence_events: 20
#     min_disagreements: 5
#     min_bad_outcomes: 2

# Optional: tune GEPA prompt-overlay optimization cost/coverage.
# Default is 5. Higher values improve case diversity but can increase
# calibrate runtime and should stay within cron.script_timeout_seconds.
# gepa_evaluator:
#   overlay_max_cases: 5
